name: Outbox failure tests

on:
  push:
    branches: [main]
    paths: ['examples/transactional-outbox/**', '.github/workflows/outbox.yml']
  pull_request:
    paths: ['examples/transactional-outbox/**', '.github/workflows/outbox.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: examples/transactional-outbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
