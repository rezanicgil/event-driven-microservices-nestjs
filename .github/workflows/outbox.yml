name: Outbox failure tests

on:
  push:
    branches: [main]
    paths: ['examples/transactional-outbox/**', '.github/workflows/outbox.yml']
  pull_request:
    paths: ['examples/transactional-outbox/**', '.github/workflows/outbox.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: outbox-test
          RABBITMQ_DEFAULT_PASS: local-test-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: examples/transactional-outbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:broker
        env:
          AMQP_URL: amqp://outbox-test:local-test-only@localhost:5672
